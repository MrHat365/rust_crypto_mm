strategy_kind: toxicity_mm
strategy:
  venue: gate
  symbol: BTC_USDT
  size: 1
  use_reference_bbo: true
  quote_at_reference_bbo: true
  min_half_spread_bps: 4.0
  volatility_ewma_alpha: 0.2
  volatility_multiplier: 1.5
  fee_bps: 1.0
  venue_buffer_bps: 1.0
  reprice_fraction: 0.5
  quote_interval_ms: 50
  max_age_ms: 400
  cross_guard_ticks: 1
  cancellation_delay_ms: 20
toxicity_mm:
  gamma: 0.08
  k: 1.5
  tau_secs: 8.0
  sigma_floor: 0.0001
  ofi_gain: 0.15
  toxicity_gain: 2.0
  kyle_gain: 0.5
  vpin_bucket_usd: 25000.0
  vpin_buckets: 50
  inventory_limit: 0.0
feeds:
  gate: true
  binance: auto
  bybit: auto
  bitget: auto
  okx: auto
  mexc: false
  lighter: auto
  digifinex: auto
  weex: auto
risk:
  max_order_notional: 400.0
  max_position_notional: 500.0
mode:
  dry_run: true
  log_fills: false
  debug_prints: true
  demean_prices: false
logging:
  enabled: true
  path: logs/toxicity_mm.csv
  flush_interval_ms: 200
credentials:
  api_key_env: gateio_api_key
  api_secret_env: gateio_secret_key
