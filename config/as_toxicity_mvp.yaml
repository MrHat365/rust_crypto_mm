strategy_kind: as_toxicity

strategy:
  venue: gate
  symbol: BTC_USDT
  size: 1
  quote_interval_ms: 100
  min_tick: 0.1
  min_half_spread_bps: 4.0
  volatility_ewma_alpha: 0.2
  volatility_multiplier: 1.5
  fee_bps: 1.0
  venue_buffer_bps: 1.0
  reprice_fraction: 0.35
  max_age_ms: 3000
  cross_guard_ticks: 1
  cancellation_delay_ms: 40

as_toxicity:
  gamma: 0.1
  k: 1.5
  tau_secs: 30.0
  inventory_limit: 5.0
  toxicity_window: 32
  ofi_skew_bps: 2.0
  signed_vol_widen_bps: 3.0
  microprice_blend: 0.5

feeds:
  gate: true
  binance: true
  bybit: auto
  bitget: false
  okx: false
  mexc: false
  lighter: false
  digifinex: false
  weex: false

risk:
  max_order_notional: 400.0
  max_position_notional: 800.0

mode:
  dry_run: true
  log_fills: true
  debug_prints: true
  markout_prints: false
  demean_prices: true

logging:
  enabled: true
  path: logs/as_toxicity_activity.csv
  flush_interval_ms: 200

settle: usdt

credentials:
  api_key_env: gateio_api_key
  api_secret_env: gateio_secret_key
